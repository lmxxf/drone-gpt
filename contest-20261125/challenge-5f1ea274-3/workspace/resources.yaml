resources:
- name: vmec2000
  kind: tool
  source: preinstalled
  command: xvmec2000
  version: STELLOPT 780f5db557eacc7ca1160f4ca5a10a80922e4f26
  description: 'VMEC2000 fixed-boundary equilibrium solver at /opt/stellarator/bin/xvmec2000.
    Usage: mpirun --allow-run-as-root -np 8 xvmec2000 input.NAME, writes wout_NAME.nc.'
- name: neo
  kind: tool
  source: preinstalled
  command: xneo
  version: STELLOPT 780f5db557eacc7ca1160f4ca5a10a80922e4f26
  description: 'NEO effective-ripple code (Nemov version in STELLOPT) at /opt/stellarator/bin/xneo.
    Usage: xneo NAME, reads the control file neo_in.NAME and the boozmn file it names.
    One line differs from upstream: in NEO/Sources/flint_bo.f90 the correction for
    near-rational surfaces takes abs(iota); upstream uses the signed value and returns
    NaN on such surfaces when iota < 0.'
- name: simple
  kind: tool
  source: preinstalled
  command: simple.x
  version: SIMPLE 9269e8614e581ede8768e0bccb003b52db87e3be, libneo f1bef44e80c4508f04594d4d2ca120eaf17564f8
  description: 'SIMPLE guiding-centre orbit tracer at /opt/stellarator/bin/simple.x,
    built with SIMPLE_DETERMINISTIC_FP=ON. Usage: simple.x simple.in (Fortran namelist
    config), per-orbit results in orbit_exit_code.dat.'
- name: booz_xform
  kind: tool
  source: preinstalled
  command: /opt/stellarator/env/bin/python -c 'import booz_xform'
  version: booz_xform 21aff118735de4255641aa1b64fc7ab35e8c9767
  description: 'Boozer-coordinate transform of a VMEC wout, as a Python module (Booz_xform:
    read_wout, run, write_boozmn).'
- name: simsopt
  kind: tool
  source: preinstalled
  command: /opt/stellarator/env/bin/python -c 'import simsopt'
  version: simsopt 1.10.6
  description: SIMSOPT; the evaluation takes the boundary L_grad(B) from simsopt.mhd.vmec_diagnostics.vmec_compute_geometry
    on the VMEC output.
- name: sources-and-toolchain
  kind: tool
  source: preinstalled
  command: gfortran
  version: gcc/gfortran 15.3.0, cmake 4.4.3, OpenMPI 5.0.10; sources (GitHub commits)
    PrincetonUniversity/STELLOPT 780f5db5, itpplasma/SIMPLE 9269e861, itpplasma/libneo
    f1bef44e, hiddenSymmetries/booz_xform 21aff118, lazy-fortran/fortnum b382eff4,
    lazy-fortran/fortio 11afd0bd, lazy-fortran/fortplot feabb592, jacobwilliams/pyplot-fortran
    217d0c97
  description: The pinned sources the programs were built from are in /opt/stellarator/src,
    one directory per repository at the commit above, without git history; fortnum,
    fortio, fortplot and pyplot-fortran are the libraries SIMPLE builds with. NEO/Sources/flint_bo.f90
    carries the one-line change described for NEO. Compilers and build tools are in
    the environment below, so the programs can be rebuilt or modified in a copy.
- name: python-env
  kind: tool
  source: preinstalled
  command: /opt/stellarator/env/bin/python
  version: Python 3.12.14, numpy 2.5.3, scipy 1.18.1, netCDF4 1.7.4, f90nml 1.5, matplotlib
    3.11.2, simsopt 1.10.6, jax 0.11.2 (CPU)
  description: 'Conda environment at /opt/stellarator/env holding the programs above;
    the evaluation runs in it, so pip refuses to change it. Install further packages
    into a new environment: conda create (conda of Miniforge 26.7.2 at /opt/miniforge3/bin/conda,
    on PATH, conda-forge channel) or python -m venv.'
- name: landreman-paul-2022-qa
  kind: data
  source: bundled
  path: reference_configurations/landreman_paul_2022_QA.json
  format: boundary JSON in the submission format
  description: Landreman and Paul 2022, precise QA (N_FP=2); boundary of doi:10.5281/zenodo.5645413,
    configurations/new_QA.
